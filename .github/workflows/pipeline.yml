
name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  # =========================
  # CI: SERVER
  # =========================
  server-ci:
    name: Server CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test -- --runInBand

      - name: Build application
        working-directory: server
        run: npm run build

  # =========================
  # CI: CLIENT
  # =========================
  client-ci:
    name: Client CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Run ESLint
        working-directory: client
        run: npm run lint

      - name: Build application
        working-directory: client
        run: npm run build

  # =========================
  # CD: DOCKER PUBLISH
  # =========================
  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - server-ci
      - client-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/konstantin222-stu/docker-ci-cd-trening-server:latest
            ghcr.io/konstantin222-stu/docker-ci-cd-trening-server:sha-${{ github.sha }}

      - name: Build and push Client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/konstantin222-stu/docker-ci-cd-trening-client:latest
            ghcr.io/konstantin222-stu/docker-ci-cd-trening-client:sha-${{ github.sha }}
